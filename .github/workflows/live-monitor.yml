name: Live complaint monitor checks
on:
  push:
    paths: ['realtime/**', 'web/app.py', 'web/templates/*monitor*', 'web/templates/*complaints*', 'web/tests/test_live_monitor*', '.github/workflows/live-monitor.yml']
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install flask requests
      - run: python -m compileall -q realtime web api
      - run: python -m unittest discover -s realtime -p test_complaint_pipeline.py -v
      - run: python -m unittest discover -s web/tests -p test_live_monitor.py -v
      - run: node web/tests/test_live_monitor.cjs
