<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HeatAhead{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1e24'/%3E%3Crect x='8' y='6' width='16' height='22' rx='1.5' fill='%23272c34'/%3E%3Crect x='11' y='9' width='4' height='4' fill='%23101317'/%3E%3Crect x='17' y='9' width='4' height='4' fill='%23ffc46b'/%3E%3Crect x='11' y='15' width='4' height='4' fill='%23101317'/%3E%3Crect x='17' y='15' width='4' height='4' fill='%23101317'/%3E%3Crect x='11' y='21' width='4' height='4' fill='%23ffc46b'/%3E%3Crect x='17' y='21' width='4' height='4' fill='%23101317'/%3E%3C/svg%3E">
<style>
/* docs/design-language.md â€” building materials: night, masonry, mortar,
   limestone, concrete; weathered brick is the one accent, a lit window
   (--window) is reserved for heat itself. */
:root { --bg:#101317; --panel:#1a1e24; --ink:#e9e6e0; --muted:#9aa0a8;
        --accent:#b65c3f; --ok:#4f9e7a; --warn:#c9973f; --bad:#c25450; --line:#272c34;
        --window:#ffc46b; --well:#0d1015; --on-accent:#15120e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
nav { display:flex; gap:1.2rem; align-items:center; padding:.8rem 1.4rem;
      background:var(--panel); border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:10; flex-wrap:wrap; }
nav .brand { font-weight:700; color:var(--accent); font-size:1.1rem; text-decoration:none; }
nav a { color:var(--muted); text-decoration:none; }
nav a:hover, nav a.active { color:var(--ink); }
nav a.active { border-bottom:2px solid var(--accent); padding-bottom:2px; }
main { max-width:1100px; margin:0 auto; padding:1.5rem 1.2rem; }
footer { max-width:1100px; margin:0 auto; padding:0 1.2rem 2rem; color:var(--muted);
         font-size:.82rem; display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
.card { background:var(--panel); border:1px solid var(--line);
        border-radius:10px; padding:1.2rem 1.4rem; margin-bottom:1rem; }
h1 { font-size:1.6rem; margin:.2rem 0 .6rem; } h2 { font-size:1.15rem; }
a { color:var(--accent); }
.muted { color:var(--muted); } .accent { color:var(--accent); }
.big { font-size:2.6rem; font-weight:700; }
input, select, button { font:inherit; border-radius:7px; border:1px solid var(--line);
  background:var(--well); color:var(--ink); padding:.55rem .8rem; }
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
button { background:var(--accent); color:var(--on-accent); border:none; font-weight:600;
         cursor:pointer; } button:hover { filter:brightness(1.1); }
button:disabled { opacity:.6; cursor:wait; }
table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-weight:600; }
.chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0; }
.chip { background:var(--well); border:1px solid var(--line); border-radius:999px;
        padding:.25rem .8rem; font-size:.85rem; }
.dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%;
       background:var(--muted); margin-right:.35rem; vertical-align:middle; }
.dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
.bars { display:flex; gap:4px; align-items:flex-end; height:70px; margin:.4rem 0; }
.bars div { background:var(--accent); width:34px; border-radius:3px 3px 0 0;
            position:relative; min-height:2px; }
.bars span { position:absolute; bottom:-20px; left:0; right:0; text-align:center;
             font-size:.62rem; color:var(--muted); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
@media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }
</style>
<script>
// Display rules (docs/webapp-spec.md): calibrated numbers only, never above 99%,
// exact below 20%, bands at 20% and up.
function fmtRisk(p){
  if (p === null || p === undefined || isNaN(p)) return 'â€”';
  p = Math.min(p, 0.99);
  if (p < 0.2) return (p * 100).toFixed(p < 0.1 ? 1 : 0) + '%';
  const mid = Math.min(99, Math.round(p * 20) * 5);
  return (p >= 0.5 ? 'very high' : 'high') + ' (roughly ' +
         Math.max(20, mid - 5) + 'â€“' + Math.min(99, mid + 5) + '%)';
}
// headline version: the band word large, the range under it
function riskHTML(p){
  const t = fmtRisk(p), i = t.indexOf(' (');
  return i < 0 ? esc(t) : esc(t.slice(0, i)) +
    '<div style="font-size:1rem; font-weight:600">' + esc(t.slice(i + 2, -1)) + '</div>';
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="brand" href="/">HeatAhead</a>
  <a href="/" class="{{ 'active' if page == 'signup' }}">Sign up</a>
  <a href="/building" class="{{ 'active' if page == 'building' }}">Check a building</a>
  <a href="/map" class="{{ 'active' if page == 'map' }}">Risk map</a>
  <a href="/monitor" class="{{ 'active' if page == 'monitor' }}">Live monitor</a>
</nav>
<main>{% block body %}{% endblock %}</main>
<footer>
  <span><span class="dot" id="hdot"></span><span id="hstatus">checking the LinuxONE backendâ€¦</span></span>
  <span>Building-level data only Â· probabilities calibrated on the held-out 2025-26 winter</span>
  <span>Demo: no login</span>
</footer>
<script>
(async () => {
  const dot = document.getElementById('hdot'), st = document.getElementById('hstatus');
  try {
    const h = await (await fetch('/api/health')).json();
    const z = h.linuxone || (h.arch === 's390x' ? h : null);
    if (z && !z.offline) {
      dot.className = 'dot ok';
      st.textContent = (h.host === 'vercel' ? 'Site on Vercel Â· ' : '') +
        'scores and sign-ups on IBM LinuxONE (' + (z.arch || 's390x') + '), ' +
        (z.ranked || 0).toLocaleString() + ' buildings ranked';
    } else if (h.linuxone) {
      dot.className = 'dot bad';
      st.textContent = 'LinuxONE backend offline: browsing still works, sign-ups are held temporarily';
    } else {
      dot.className = 'dot warn';
      st.textContent = 'Running ' + h.mode + ' mode on ' + h.host + ' (' + h.arch + ')';
    }
  } catch { st.textContent = 'status unavailable'; }
})();
</script>
</body>
</html>
